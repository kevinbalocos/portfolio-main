<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jadeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow/shadow -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#0f766e" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main diamond/gem shape (more angular and professional) -->
  <polygon points="100,25 160,65 180,100 160,135 100,175 40,135 20,100 40,65" 
           fill="url(#jadeGradient)" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Inner facets for depth -->
  <polygon points="100,40 145,75 170,100 145,125 100,160 55,125 30,100 55,75" 
           fill="#2dd4bf" opacity="0.3" stroke="none"/>
  
  <!-- Top highlight facet -->
  <polygon points="100,25 130,50 100,45" fill="url(#highlightGradient)" stroke="none"/>
  
  <!-- Left highlight -->
  <polygon points="40,65 60,85 50,75" fill="#ffffff" opacity="0.25" stroke="none"/>
  
  <!-- Code symbol container circle (subtle) -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  
  <!-- Left bracket < -->
  <g opacity="0.95">
    <polyline points="75,80 82,88 75,96" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Right bracket > -->
  <g opacity="0.95">
    <polyline points="125,80 118,88 125,96" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Central forward slash / -->
  <g opacity="0.95">
    <line x1="95" y1="108" x2="105" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom accent circle for tech feel -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2" stroke-dasharray="2,3"/>
</svg>